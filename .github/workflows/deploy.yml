name: CI & Deployment Pipeline

on:
  push:
    branches:
      - v2-django
      - main
  pull_request:
    branches:
      - v2-django
      - main

jobs:
  test:
    name: Lint & Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run Ruff Lint Check
        run: |
          ruff check .

      - name: Run Pytest Test Suite
        run: |
          pytest

  deploy:
    name: Deploy to Production Lightsail
    needs: test
    if: (github.ref == 'refs/heads/v2-django' || github.ref == 'refs/heads/main') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH to Lightsail Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            echo "==> Executing automated production update on Lightsail..."
            bash /app/deploy/lightsail/update.sh
            echo "==> Production update finished successfully!"
