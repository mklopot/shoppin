mac-and-cheese casserole: &id012 !!python/object:recipes.Recipe
  description: adapted from https://www.momontimeout.com/best-homemade-baked-mac-and-cheese-recipe/
  directions: "Preheat oven to 350F. Lightly grease a large 3 qt or 4 qt baking dish\
    \ and set aside.Combine shredded cheeses in a large bowl and set aside.\nCook\
    \ the pasta one minute shy of al dente according to the package instructions.\
    \ Remove from heat, drain, and place in a large bowl.\n\nDrizzle pasta with olive\
    \ oil and stir to coat pasta. Set aside to cool while preparing cheese sauce.\n\
    Melt butter in a deep saucepan, dutch oven, or stock pot.\nWhisk in flour over\
    \ medium heat and continue whisking for about 1 minute until bubbly and golden.\n\
    Gradually whisk in the milk and heavy cream until nice and smooth. Continue whisking\
    \ until you see bubbles on the surface and then continue cooking and whisking\
    \ for another 2 minutes. Whisk in salt and pepper.\nAdd two cups of shredded cheese\
    \ and whisk until smooth. Add another two cups of shredded cheese and continue\
    \ whisking until creamy and smooth. Sauce should be nice and thick.\nStir in the\
    \ cooled pasta until combined and pasta is fully coated with the cheese sauce.\n\
    Pour half of the mac and cheese into the prepared baking dish. Top with remaining\
    \ 2 cups of shredded cheese and then the remaining mac and cheese.\nIn a small\
    \ bowl, combine panko crumbs, Parmesan cheese, melted butter and paprika. Sprinkle\
    \ over the top and bake until bubbly and golden brown, about 30 minutes. Serve\
    \ immediately.\n\nTips for the Best Homemade Baked Mac and Cheese\nUse block cheese\
    \ and shred, do not buy the pre-shredded cheese. The pre-shredded cheese is great\
    \ for so many things but not macaroni and cheese. It\u2019s coated and won\u2019\
    t melt properly. You need to shred it yourself for the best result.\nCook your\
    \ pasta to slightly less than al dente, about one minute shy is perfect. The reason\
    \ is that this is baked mac and cheese so the pasta will continue to cook in the\
    \ homemade cheese sauce in the oven. You don\u2019t want soggy macaroni.\nI used\
    \ elbow pasta but really, any tubular past will work.\nThis mac and cheese recipe\
    \ starts with a roux. The roux is super important to getting the creamiest cheese\
    \ sauce of your life. \nThe roux (equal parts butter and flour) is whisked together\
    \ until bubbly and golden.\nWhisk in cold milk \u2013 not warm \u2013 to prevent\
    \ the flour from clumping.\nCook the roux until  you see bubbles on the surface\
    \ and then continue cooking for an additional 2 minutes before adding the cheese.\n"
  ingredients:
