twice baked potatoes: &id033 !!python/object:recipes.Recipe
  description: ''
  directions: "Preheat the oven to 400\xB0F. Wash and dry the potatoes well, then\
    \ use a fork to prick each potato several times. Place the potatoes on a parchment\
    \ lined baking sheet. Drizzle the olive oil over the potatoes, then use your hands\
    \ or a silicone brush to brush the oil over each potato until it is fully coated.\
    \ Season the potatoes with a pinch of salt. Bake in the preheated oven for 50-60\
    \ minutes, or until the potatoes can be pierced easily with a fork. Total baking\
    \ time will depend on the size of your potatoes. Optionally, while the potatoes\
    \ are baking, cook the bacon in a skillet over medium heat until brown and crispy.\
    \ Remove the cooked bacon from the skillet and allow it to drain on a paper-towel\
    \ lined plate. Once cool enough to handle, rough chop the bacon into smaller pieces.\
    \ nce the potatoes are done baking, remove them from the oven and allow them to\
    \ cool slightly. When the potatoes are cool enough to handle, slice them in half\
    \ lengthwise. Carefully scoop out the potato flesh, leaving a thin rim of potato\
    \ (about \xBC inch rim) around the edges to help the skin hold its shape. Place\
    \ the scooped out potato flesh in a large bowl and add the butter, sour cream,\
    \ milk, salt, and pepper. Use a potato masher or hand mixer to blend the potatoes\
    \ until light and fluffy. Add the chopped bacon, half of the sliced green onions,\
    \ and 1/2 cup of the shredded cheddar cheese to the mashed potatoes, then fold\
    \ to combine. Fill the potato skins with about 1/3 cup of the potato mixture,\
    \ then sprinkle the remaining cheddar cheese over the top of each potato. Bake\
    \ the potatoes in the oven a second time, just until heated through and the cheddar\
    \ cheese is melted on top, about 20 minutes. Top with the remaining green onions\
    \ and enjoy!\n"
  ingredients:
