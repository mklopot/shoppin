  directions: |
    Mix the spice rub, rub on the meat:
     1 tsp onion powder
     1 tbsp brown sugar
     2 tsp paprika
     1 tsp garlic powder
     .5 tsp cumin powder
     .75 tsp dry mustard powder
     1 tsp salt
     .5 tsp black pepper
    
    For sauce, mix in the Instant Pot:
     0.5 cups apple cider vinegar
     2 garlic cloves, minced
     1.5 cups ketchup
     0.5 cups brown sugar
