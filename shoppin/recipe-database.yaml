'stir fry':
  description: |
    My interpretation of 炒蔬菜
    
  directions: |
    The night before, freeze the tofu to get a spongy texture.
    Following day, defrost the tofu, I use a Sous Vide circulator at 95F for 1 hr.
    
    Cook rice in Instant Pot per usual directions (1 cup rice to 1.5 cups water, cook on rice setting, release pressure after 2 min after completion, open and cool slightly, gently transfer to serving bowl. 
    
    Chop vegetables. Preheat a wok on high heat. Add oil, ginger, peeled garlic, hot pepper (optional), let fry for ~30 seconds.
    
    Add vegetables to wok (in batches, if desired). Stir vigorously to prevent sticking and burning.
    
    When vegetables reach desired doneness, sprinkle with soy sauce, add ketchup and stir-fry sauce. Cook while stirring for one more minute. Transfer to service bowl, sprinkle with sesame oil, cilantro leaves and sesame seeds.
    
