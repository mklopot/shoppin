    Meanwhile, reduce the sauce until just starting to get syrupy.
    
    Baste the meat generously with the sauce, bake another 5 min. Baste again, bake another 5-10 min, but be careful not to burn, as the sauce becomes bitter if burnt.
    
    Slice against the grain, and serve with the remained of the sauce
    
