     2 tsp onion powder
     2 tsp dry mustard powder
     1 tsp cayenne pepper
     1 tbsp Worcestershire sauce
    
    Make a mental note of how the grain runs on the meat, it may be more difficult to tell once cooked and covered in sauce. 
    Place a ~3 lb brisket into the Instant Pot, cook on 'slow cook' setting for 8-10 hrs, until fork tender.
    
