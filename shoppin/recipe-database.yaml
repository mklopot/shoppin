'kale gnocchi':
  description: |
    From https://www.delish.com/cooking/recipe-ideas/a41037917/creamy-kale-and-gnocchi-bake-recipe/
    
  directions: |
    Step 1
    Preheat oven to 375º. 
    
    
    In a large pot over medium-high heat, heat oil. Add kale a large handful at a time, tossing with tongs and slightly wilting each batch before adding the next, until all kale is added and leaves are bright green and just wilted, about 5 minutes total. Season kale with 1/2 teaspoon salt and transfer into an 11"-by-8" (2-quart) baking dish.
    Step 2
    In same pot over medium heat, melt butter. Cook shallots and garlic, stirring often, until tender and light golden, 3 to 5 minutes. Add flour and cook, stirring, until lightly toasted, about 1 minute more.
    Step 3
    While whisking, slowly pour in milk until combined and smooth. Whisk in mustard, nutmeg, 3/4 teaspoon salt, and 1/4 teaspoon pepper. Stir in gnocchi. Bring mixture to a simmer over medium heat, stirring occasionally, and cook until thickened slightly, about 1 minute.
    Step 4
    Remove pot from heat and whisk in 1 cup Monterey Jack cheese until melted.
    Return cooked kale to pot and toss to combine, then scrape kale mixture into baking dish. Top with Parmesan and remaining 1 cup Monterey Jack cheese.
    For an extra layer of crunch, add 1 cup panko bread crumbs when you add the cheese.
    Step 5
    Bake until filling is bubbling and top is golden, 16 to 20 minutes. Let cool 10 minutes before serving.
    
