'Vegetarian Borscht':
  description: |
    Traditional Ukrainian beet soup. The family recipe is vegetarian, presumably originally for kosher reasons: it was a choice between meat or sour cream, and the sour cream won. 
  directions: |
    Steam a large beet in the Instant Pot for 35+ minutes, then peel.
    
    Start heating 2 cups of water. Peel and cut the potato into large pieces, peel and slice the carrots, add both immediately to the hot or boiling water. 
    
    Dice the onion and saute slowly in the oil on low heat until translucent but not browned. 
    
    While the onion is cooking, peel and chop the celery, chop the bell pepper, and add to the hot water. 
    
    Add the beet, tomato paste, bouillon base, vinegar. Add 6 more cups of boiling water, pressure cook on 'Soup' setting in the Instant Pot for 7 minutes.
    
    In the meanwhile, chop the cabbage thinly, peel and chop the garlic, and add both to the soup after the pressure cooking has finished. Continue cooking 5 to 10 more minutes.
    
    Salt and pepper to taste.
    
    Serve topped with a dollop of sour cream, chopped green onion and dill, and additional fresh minced garlic as desired 
  ingredients:
    - 'onion, yellow'

    - 'carrots':
        amount: '2'

    - 'beet, large'

    - 'celery':
        amount: '3 ribs'

    - 'tomato paste':
        amount: '6 oz'

    - 'garlic':
        amount: '5 cloves'

    - 'bell pepper'

    - 'green onion':
        amount: '2 stalks'

    - 'dill':
        amount: '2 tbsp'

    - 'sour cream':
        amount: '3 tbsp'

    - 'potato'

    - 'cabbage':
        amount: '4 oz'

    - 'vegetable oil':
        amount: '3 tbsp'

    - 'vinegar':
        amount: '1 tbsp'

    - 'bouillon base'


