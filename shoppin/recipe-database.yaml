        amount: '4 tbsp'

    - 'lemon juice, freshly squeezed':
        amount: '2 tbsp'

    - 'vinegar':
        amount: '2 tsp'

    - 'black pepper':
        amount: '1.5 tsp'

    - 'eggs':
        amount: '3'
        optional: True

    - 'cucumber, english'

    - 'green onions'

    - 'dill'


