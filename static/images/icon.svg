<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- 90s Squircle Container -->
  <rect x="1.5" y="1.5" width="45" height="45" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <rect x="3.5" y="3.5" width="41" height="41" rx="8" fill="#f8fafc"/>

  <!-- Subtle ground/shelf baseline -->
  <rect x="5" y="42" width="38" height="1.5" fill="#0f172a"/>

  <!-- Left: Outline-Free 4-Row Recipe Checklist -->
  <!-- Row 1 -->
  <rect x="5" y="11" width="3" height="3" fill="#059669"/>
  <rect x="10" y="11.5" width="9.5" height="2" fill="#0f172a"/>
  <!-- Row 2 -->
  <rect x="5" y="17.5" width="3" height="3" fill="#059669"/>
  <rect x="10" y="18" width="8" height="2" fill="#0f172a"/>
  <!-- Row 3 -->
  <rect x="5" y="24" width="3" height="3" fill="#059669"/>
  <rect x="10" y="24.5" width="10" height="2" fill="#0f172a"/>
  <!-- Row 4 -->
  <rect x="5" y="30.5" width="3" height="3" fill="#059669"/>
  <rect x="10" y="31" width="7" height="2" fill="#0f172a"/>

  <!-- Right: Clean-Line Metal Cart with Flush Top Rim -->
  <path d="M22.5 17h3l2.8 11.5a1.2 1.2 0 0 0 1.2.9h10.5a1.2 1.2 0 0 0 1.2-.9l2.5-8.5H26" 
        stroke="#0f172a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Vertical wire ribs strictly terminated inside top rim -->
  <line x1="30.5" y1="19" x2="30.5" y2="27" stroke="#0f172a" stroke-width="1.2" stroke-linecap="butt"/>
  <line x1="34.5" y1="19" x2="34.5" y2="27" stroke="#0f172a" stroke-width="1.2" stroke-linecap="butt"/>
  <line x1="38.5" y1="19" x2="38.5" y2="26.5" stroke="#0f172a" stroke-width="1.2" stroke-linecap="butt"/>
  <!-- Wheels -->
  <circle cx="30.5" cy="36" r="2.2" fill="#0f172a"/>
  <circle cx="38.5" cy="36" r="2.2" fill="#0f172a"/>
</svg>
