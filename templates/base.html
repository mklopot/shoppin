<!DOCTYPE html>
<html lang="en" class="h-full bg-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Shoppin{% endblock %}</title>

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- HTMX + Extensions -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx-ext-ws@2.0.1/ws.js"></script>

    <!-- SortableJS for Drag-and-Drop Reordering -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>

    <style>
        body { font-family: Arial, Helvetica, sans-serif; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="h-full flex flex-col bg-white text-gray-900 antialiased text-sm">
    <!-- Navbar -->
    <header class="bg-white border-b border-gray-300 sticky top-0 z-30">
        <div class="max-w-5xl mx-auto px-3 sm:px-4">
            <div class="flex justify-between h-11 items-center">
                <div class="flex items-center space-x-6">
                    <a href="/" class="flex items-center space-x-1.5 font-bold text-base text-gray-900">
                        <span>🛒</span>
                        <span>Shoppin</span>
                    </a>
                    <nav class="flex space-x-1 text-xs">
                        <a href="/" class="px-2.5 py-1 font-semibold {% if request.resolver_match.url_name == 'list' %}text-gray-900 border-b-2 border-gray-800{% else %}text-gray-600 hover:text-gray-900{% endif %}">
                            Shopping List
                        </a>
                        <a href="/mealplans/" class="px-2.5 py-1 font-medium {% if 'mealplans' in request.path %}text-gray-900 border-b-2 border-gray-800{% else %}text-gray-600 hover:text-gray-900{% endif %}">
                            Meal Plans
                        </a>
                        <a href="/recipes/" class="px-2.5 py-1 font-medium {% if 'recipes' in request.path %}text-gray-900 border-b-2 border-gray-800{% else %}text-gray-600 hover:text-gray-900{% endif %}">
                            Recipes
                        </a>
                        <a href="/preset-lists/" class="px-2.5 py-1 font-medium {% if 'preset' in request.path %}text-gray-900 border-b-2 border-gray-800{% else %}text-gray-600 hover:text-gray-900{% endif %}">
                            Preset Lists
                        </a>
                    </nav>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-5xl w-full mx-auto px-3 sm:px-4 py-3">
        {% block content %}{% endblock %}
    </main>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
