<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Shoppin - Meal Planner & Grocery List{% endblock %}</title>

    <!-- Tailwind CSS (CDN for fast development) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>

    <!-- HTMX + Extensions -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/htmx-ext-ws@2.0.1/ws.js"></script>

    <!-- SortableJS for Drag-and-Drop Reordering -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>

    {% block extra_head %}{% endblock %}
</head>
<body class="h-full flex flex-col font-sans text-gray-900 antialiased">
    <!-- Navbar -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-8">
                    <a href="/" class="flex items-center space-x-2">
                        <span class="text-2xl">🛒</span>
                        <span class="font-bold text-xl text-gray-900 tracking-tight">Shoppin</span>
                    </a>
                    <nav class="hidden md:flex space-x-4">
                        <a href="/" class="px-3 py-2 rounded-md text-sm font-medium {% if request.resolver_match.url_name == 'index' %}bg-gray-100 text-gray-900{% else %}text-gray-600 hover:text-gray-900 hover:bg-gray-50{% endif %}">
                            Shopping List
                        </a>
                        <a href="/mealplans/" class="px-3 py-2 rounded-md text-sm font-medium {% if 'mealplans' in request.path %}bg-gray-100 text-gray-900{% else %}text-gray-600 hover:text-gray-900 hover:bg-gray-50{% endif %}">
                            Meal Plans
                        </a>
                        <a href="/recipes/" class="px-3 py-2 rounded-md text-sm font-medium {% if 'recipes' in request.path %}bg-gray-100 text-gray-900{% else %}text-gray-600 hover:text-gray-900 hover:bg-gray-50{% endif %}">
                            Recipes
                        </a>
                        <a href="/preset-lists/" class="px-3 py-2 rounded-md text-sm font-medium {% if 'preset' in request.path %}bg-gray-100 text-gray-900{% else %}text-gray-600 hover:text-gray-900 hover:bg-gray-50{% endif %}">
                            Preset Lists
                        </a>
                    </nav>
                </div>
                <div class="flex items-center space-x-3">
                    <span class="text-xs bg-emerald-100 text-emerald-800 font-semibold px-2.5 py-1 rounded-full">v2.0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-4 text-center text-xs text-gray-500">
        Shoppin &middot; Modern Grocery Planner
    </footer>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
