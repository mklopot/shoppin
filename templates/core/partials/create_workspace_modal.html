<div id="create-workspace-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">
    <div class="bg-white border border-gray-400 shadow-xl w-full max-w-sm rounded-none p-5 space-y-4">
        <div class="flex items-center justify-between border-b border-gray-300 pb-2">
            <h3 class="font-bold text-sm text-gray-900">Create New Workspace</h3>
            <button type="button" onclick="document.getElementById('create-workspace-modal').remove()" class="text-gray-400 hover:text-gray-700 text-lg font-bold leading-none">&times;</button>
        </div>

        <form action="{% url 'core:create_workspace' %}" method="post" class="space-y-3 text-xs">
            {% csrf_token %}
            <div>
                <label class="block text-gray-700 font-medium mb-1">Workspace Name:</label>
                <input type="text" name="name" placeholder="e.g. Vacation Cabin, Office Pantry, Family" required autofocus
                       class="w-full border border-gray-400 px-2.5 py-1.5 bg-white text-gray-900 rounded-none focus:outline-none focus:border-gray-700">
                <p class="text-[11px] text-gray-500 mt-1">Each workspace contains its own shopping list, preset lists, and meal plan.</p>
            </div>

            <div class="flex justify-end space-x-2 pt-2 border-t border-gray-200">
                <button type="button" onclick="document.getElementById('create-workspace-modal').remove()" class="border border-gray-300 bg-white hover:bg-gray-100 px-3 py-1 text-gray-700">
                    Cancel
                </button>
                <button type="submit" class="border border-gray-800 bg-gray-800 hover:bg-black text-white px-3.5 py-1 font-semibold">
                    Create Workspace
                </button>
            </div>
        </form>
    </div>
</div>
