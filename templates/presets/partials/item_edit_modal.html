<div id="modal-backdrop" class="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
        <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" onclick="document.getElementById('modal-placeholder').innerHTML = ''"></div>
        <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

        <div class="inline-block align-bottom bg-white text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-md sm:w-full border border-gray-300">
            <form hx-post="{% url 'shopping:preset_edit_item' preset_list.id item.id %}"
                  hx-target="#preset-items-container"
                  hx-swap="outerHTML"
                  hx-on::after-request="document.getElementById('modal-placeholder').innerHTML = ''">
                {% csrf_token %}
                <div class="bg-white px-5 pt-5 pb-4 sm:p-6 sm:pb-4 space-y-4">
                    <div class="flex items-center justify-between pb-3 border-b border-gray-200">
                        <h3 class="text-base font-bold text-gray-900" id="modal-title">
                            Edit Item in {{ preset_list.name }}
                        </h3>
                        <button type="button"
                                onclick="document.getElementById('modal-placeholder').innerHTML = ''"
                                aria-label="Close dialog"
                                class="text-gray-500 hover:text-gray-800 font-bold">
                            <span aria-hidden="true">✕</span>
                        </button>
                    </div>

                    <div>
                        <label for="preset-edit-item-name" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
                            Item Name <span class="text-red-500">*</span>
                        </label>
                        <input type="text"
                               id="preset-edit-item-name"
                               name="name"
                               value="{{ item.name }}"
                               required
                               list="all-ingredients-datalist"
                               autocomplete="off"
                               class="w-full border border-gray-300 px-3 py-1.5 text-sm focus:outline-none focus:border-indigo-500">
                    </div>

                    <div>
                        <label for="preset-edit-item-amount" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
                            Amount &amp; Unit
                        </label>
                        <input type="text"
                               id="preset-edit-item-amount"
                               name="amount"
                               value="{% if item.amount_unit %}{{ item.amount_display }} {{ item.amount_unit }}{% else %}{{ item.amount_display }}{% endif %}"
                               placeholder="e.g. 1 can, 2 lbs"
                               class="w-full border border-gray-300 px-3 py-1.5 text-sm focus:outline-none focus:border-indigo-500">
                        <input type="hidden" name="amount_unit" id="preset-edit-item-unit" value="">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label for="preset-edit-item-brand" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
                                Brand
                            </label>
                            <input type="text"
                                   id="preset-edit-item-brand"
                                   name="brand"
                                   value="{{ item.brand }}"
                                   placeholder="Optional"
                                   class="w-full border border-gray-300 px-3 py-1.5 text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label for="preset-edit-item-vendor" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
                                Best Vendor
                            </label>
                            <input type="text"
                                   id="preset-edit-item-vendor"
                                   name="vendor"
                                   value="{{ item.vendor }}"
                                   placeholder="e.g. Safeway"
                                   class="w-full border border-gray-300 px-3 py-1.5 text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>

                    <div>
                        <label for="preset-edit-item-category" class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-1">
                            Category / Department
                        </label>
                        <select id="preset-edit-item-category" name="category" class="w-full border border-gray-300 px-3 py-1.5 text-sm bg-white focus:outline-none focus:border-indigo-500">
                            {% for cat in known_categories %}
                            <option value="{{ cat }}" {% if item.category == cat %}selected{% endif %}>{{ cat|title }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="flex items-center space-x-2 pt-1">
                        <input type="checkbox"
                               id="edit-item-optional"
                               name="optional"
                               {% if item.optional %}checked{% endif %}
                               class="h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-0">
                        <label for="edit-item-optional" class="text-xs text-gray-700 font-medium cursor-pointer">
                            Optional item
                        </label>
                    </div>

                    <div class="flex items-center justify-between p-2.5 bg-gray-50 border border-gray-200 rounded">
                        <div>
                            <label for="edit-item-active" class="text-xs text-gray-800 font-semibold cursor-pointer">
                                Active on Schedule
                            </label>
                            <p class="text-[11px] text-gray-500">
                                When active, this item automatically loads when recurring schedules run.
                            </p>
                        </div>
                        <input type="checkbox"
                               id="edit-item-active"
                               name="is_active"
                               {% if item.is_active %}checked{% endif %}
                               class="h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-0 cursor-pointer">
                    </div>
                </div>

                <div class="bg-gray-50 px-5 py-3 sm:flex sm:flex-row-reverse border-t border-gray-200">
                    <button type="submit" class="w-full inline-flex justify-center px-4 py-1.5 bg-indigo-600 text-sm font-medium text-white hover:bg-indigo-700 sm:ml-3 sm:w-auto shadow-sm">
                        Save Changes
                    </button>
                    <button type="button"
                            onclick="document.getElementById('modal-placeholder').innerHTML = ''"
                            class="mt-3 w-full inline-flex justify-center px-4 py-1.5 border border-gray-300 text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 sm:mt-0 sm:w-auto">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
