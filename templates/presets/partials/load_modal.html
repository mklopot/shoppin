<div id="modal-backdrop" class="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
        <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" onclick="document.getElementById('modal-placeholder').innerHTML = ''"></div>
        <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

        <div class="inline-block align-bottom bg-white text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-md sm:w-full border border-gray-300">
            <form hx-post="{% url 'shopping:preset_load_items' preset_list.id %}"
                  {% if from_shopping_list %}
                  hx-target="#shopping-list-content"
                  hx-swap="outerHTML"
                  {% else %}
                  hx-target="#toast-container"
                  hx-swap="beforeend"
                  {% endif %}
                  hx-on::after-request="document.getElementById('modal-placeholder').innerHTML = ''">
                {% csrf_token %}
                {% if from_shopping_list %}
                <input type="hidden" name="from_shopping_list" value="1">
                <input type="hidden" name="group_by" value="{{ group_by }}">
                <input type="hidden" name="mode" value="{{ mode }}">
                {% endif %}
                <div class="bg-white px-5 pt-5 pb-4 sm:p-6 sm:pb-4 space-y-4">
                    <div class="flex items-center justify-between pb-3 border-b border-gray-200">
                        <div>
                            <h3 class="text-base font-bold text-gray-900" id="modal-title">
                                Load from Preset List
                            </h3>
                            <p class="text-xs text-gray-500">
                                "{{ preset_list.name }}"
                            </p>
                        </div>
                        <button type="button"
                                onclick="document.getElementById('modal-placeholder').innerHTML = ''"
                                class="text-gray-400 hover:text-gray-500 font-bold">
                            ✕
                        </button>
                    </div>

                    <!-- Select all / Deselect all -->
                    <div class="flex items-center justify-between text-xs text-gray-500 pb-1">
                        <span>Select items to add to your shopping list:</span>
                        <div class="space-x-2">
                            <button type="button" onclick="document.querySelectorAll('.load-item-checkbox').forEach(c => c.checked = true);" class="text-indigo-600 hover:underline">
                                All
                            </button>
                            <span>|</span>
                            <button type="button" onclick="document.querySelectorAll('.load-item-checkbox').forEach(c => c.checked = false);" class="text-indigo-600 hover:underline">
                                None
                            </button>
                        </div>
                    </div>

                    <!-- Items Checklist -->
                    <div class="max-h-60 overflow-y-auto border border-gray-200 divide-y divide-gray-100 p-1 bg-gray-50">
                        {% for item in items %}
                        <label class="flex items-center space-x-2.5 p-2 hover:bg-white cursor-pointer rounded text-xs text-gray-800">
                            <input type="checkbox"
                                   name="item_ids"
                                   value="{{ item.id }}"
                                   checked
                                   class="load-item-checkbox h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-0">
                            <span class="font-medium flex-1">
                                {{ item.name }}
                                {% if item.amount_display %}
                                <span class="text-gray-500">({{ item.amount_display }}{% if item.unit_display %} {{ item.unit_display }}{% endif %})</span>
                                {% endif %}
                                {% if item.optional %}
                                <span class="text-gray-400 italic">(optional)</span>
                                {% endif %}
                            </span>
                        </label>
                        {% empty %}
                        <p class="p-4 text-center text-xs text-gray-400 italic">This preset list has no items.</p>
                        {% endfor %}
                    </div>

                    <!-- Option to Replace Previous Items -->
                    <div class="pt-2 border-t border-gray-100">
                        <label class="flex items-start space-x-2 text-xs text-gray-700 cursor-pointer">
                            <input type="checkbox"
                                   name="replace_existing"
                                   value="true"
                                   checked
                                   class="h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-0 mt-0.5">
                            <span>
                                Replace any items previously loaded from this preset list
                            </span>
                        </label>
                    </div>
                </div>

                <div class="bg-gray-50 px-5 py-3 sm:flex sm:flex-row-reverse border-t border-gray-200">
                    <button type="submit" class="w-full inline-flex justify-center px-4 py-2 bg-indigo-600 text-sm font-medium text-white hover:bg-indigo-700 sm:ml-3 sm:w-auto shadow-sm">
                        Load to Shopping List
                    </button>
                    <button type="button"
                            onclick="document.getElementById('modal-placeholder').innerHTML = ''"
                            class="mt-3 w-full inline-flex justify-center px-4 py-2 border border-gray-300 text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 sm:mt-0 sm:w-auto">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
