<div class="occurrence-picker-block space-y-2">
    <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider">
        Next Refresh Date & Time
    </label>

    <!-- Date & Time Inputs -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-0.5">
        <!-- Date Picker -->
        <div>
            <label class="block text-[11px] font-semibold text-gray-700 mb-1">
                Date
            </label>
            <input type="date"
                   name="next_occurrence_date"
                   aria-label="Next refresh date"
                   value="{{ preset_list.next_occurrence|date:'Y-m-d'|default:default_next_date }}"
                   onchange="presetUpdatePreview(this.closest('.occurrence-picker-block'))"
                   {% if not can_write and can_write is not None %}disabled{% endif %}
                   class="occurrence-date-input w-full border border-gray-300 px-3 py-1.5 text-sm bg-white focus:outline-none focus:border-indigo-500">
        </div>

        <!-- Android Material Time Picker -->
        <div>
            <label class="block text-[11px] font-semibold text-gray-700 mb-1">
                Time
            </label>
            <div class="relative">
                <input type="text"
                       name="next_occurrence_time"
                       aria-label="Next refresh time"
                       value="{{ preset_list.next_occurrence|date:'g:i A'|default:default_next_time }}"
                       data-time="{{ preset_list.next_occurrence|date:'g:i A'|default:default_next_time }}"
                       onfocus="initAndOpenTimePicker(this)"
                       onclick="initAndOpenTimePicker(this)"
                       readonly
                       {% if not can_write and can_write is not None %}disabled{% endif %}
                       class="android-time-input occurrence-time-input w-full border border-gray-300 px-3 py-1.5 text-sm bg-white focus:outline-none focus:border-indigo-500 cursor-pointer pr-8 font-medium text-gray-800"
                       placeholder="Select time">
                <div class="absolute inset-y-0 right-0 pr-2.5 flex items-center pointer-events-none text-indigo-600">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
            </div>
            <p class="text-[10px] text-gray-600 mt-0.5">Tap to pick any hour &amp; minute on clock dial</p>
        </div>
    </div>

    <!-- Live Human-Readable Confirmation Banner -->
    <div class="mt-2 p-2 bg-indigo-50/80 border border-indigo-200 text-xs text-indigo-950 flex items-center space-x-2">
        <span class="text-base leading-none">📅</span>
        <span class="occurrence-preview-label font-medium">
            {% if preset_list.next_occurrence %}
                Will refresh next on: <strong>{{ preset_list.next_occurrence|date:"l, F j, Y \a\t g:i A" }}</strong>
            {% else %}
                Will refresh next on: <strong>{{ default_next_date }} at {{ default_next_time }}</strong>
            {% endif %}
        </span>
    </div>
</div>

<script>
if (typeof initAndroidTimePickers === 'undefined') {
    window.parseTimeTo24 = function(timeStr) {
        if (!timeStr) return { h: 12, m: 0 };
        const clean = timeStr.trim();
        const isPM = /pm/i.test(clean);
        const isAM = /am/i.test(clean);
        const match = clean.match(/(\d{1,2}):(\d{2})/);
        if (!match) return { h: 12, m: 0 };
        let h = parseInt(match[1], 10);
        const m = parseInt(match[2], 10);
        if (isPM && h < 12) h += 12;
        if (isAM && h === 12) h = 0;
        return { h: h, m: m };
    };

    window.presetUpdatePreview = function(container) {
        if (!container) return;
        const dateInput = container.querySelector('.occurrence-date-input');
        const timeInput = container.querySelector('.occurrence-time-input');
        const labelEl = container.querySelector('.occurrence-preview-label');
        if (!dateInput || !labelEl) return;

        const dateVal = dateInput.value;
        const timeVal = (timeInput ? timeInput.value : '') || '';
        if (!dateVal) {
            labelEl.innerHTML = 'Will refresh next on: <em>No date selected</em>';
            return;
        }
        try {
            const parts = dateVal.split('-').map(Number);
            const t = parseTimeTo24(timeVal);
            const dt = new Date(parts[0], parts[1] - 1, parts[2], t.h, t.m);
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' };
            labelEl.innerHTML = `Will refresh next on: <strong>${dt.toLocaleDateString(undefined, options)}</strong>`;
        } catch (e) {
            // ignore
        }
    };

    window.initAndroidTimePickers = function(container) {
        if (typeof mdtimepicker === 'undefined') return;
        const scope = container || document;
        const inputs = scope.querySelectorAll ? scope.querySelectorAll('.android-time-input') : [];
        inputs.forEach(function(input) {
            if (!input._mdtimepicker_initialized) {
                input._mdtimepicker_initialized = true;
                mdtimepicker(input, {
                    format: 'h:mm tt',
                    theme: 'indigo',
                    hourPadding: false,
                    clearBtn: false,
                    is24hour: false
                });
                input.addEventListener('change', function() {
                    presetUpdatePreview(input.closest('.occurrence-picker-block'));
                });
            }
        });
    };

    window.initAndOpenTimePicker = function(input) {
        if (typeof mdtimepicker === 'undefined' || !input) return;
        if (!input._mdtimepicker_initialized) {
            input._mdtimepicker_initialized = true;
            mdtimepicker(input, {
                format: 'h:mm tt',
                theme: 'indigo',
                hourPadding: false,
                clearBtn: false,
                is24hour: false
            });
            input.addEventListener('change', function() {
                presetUpdatePreview(input.closest('.occurrence-picker-block'));
            });
            try {
                mdtimepicker(input, 'show');
            } catch (err) {
                // fall through
            }
        }
    };

    document.addEventListener('DOMContentLoaded', function() {
        initAndroidTimePickers();
    });
    document.addEventListener('htmx:afterSwap', function(e) {
        initAndroidTimePickers(e.target);
    });
    document.addEventListener('htmx:afterProcessNode', function(e) {
        initAndroidTimePickers(e.target);
    });
}

// Always try to initialize any uninitialized pickers in this block
if (typeof initAndroidTimePickers === 'function') {
    initAndroidTimePickers();
}
</script>
