<div class="occurrence-picker-block space-y-2">
    <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider">
        Next Refresh Date &amp; Time
    </label>

    <!-- Date & Time Inputs -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-0.5">
        <!-- Date Picker -->
        <div>
            <label class="block text-[11px] font-semibold text-gray-700 mb-1">
                Date
            </label>
            <input type="date"
                   name="next_occurrence_date"
                   aria-label="Next refresh date"
                   value="{{ preset_list.next_occurrence|date:'Y-m-d'|default:default_next_date }}"
                   onchange="presetUpdatePreview(this.closest('.occurrence-picker-block'))"
                   {% if not can_write and can_write is not None %}disabled{% endif %}
                   class="occurrence-date-input w-full border border-gray-300 px-3 py-1.5 text-sm bg-white focus:outline-none focus:border-indigo-500">
        </div>

        <!-- Direct Typed & Dial Time Picker -->
        <div>
            <label class="block text-[11px] font-semibold text-gray-700 mb-1">
                Time (e.g. 4:00 AM, 4am)
            </label>
            <div class="relative flex items-center">
                <input type="text"
                       name="next_occurrence_time"
                       aria-label="Next refresh time"
                       value="{{ preset_list.next_occurrence|date:'g:i A'|default:default_next_time }}"
                       oninput="presetUpdatePreview(this.closest('.occurrence-picker-block'))"
                       onchange="presetUpdatePreview(this.closest('.occurrence-picker-block'))"
                       {% if not can_write and can_write is not None %}disabled{% endif %}
                       class="occurrence-time-input w-full border border-gray-300 px-3 py-1.5 text-sm bg-white focus:outline-none focus:border-indigo-500 pr-10 font-medium text-gray-800"
                       placeholder="4:00 AM">
                <!-- Hidden proxy for mdtimepicker dial popup -->
                <input type="text"
                       style="position: absolute; opacity: 0; pointer-events: none; width: 0; height: 0;"
                       class="clock-dial-proxy"
                       tabindex="-1"
                       aria-hidden="true">
                <button type="button"
                        onclick="triggerClockDialPicker(this)"
                        {% if not can_write and can_write is not None %}disabled{% endif %}
                        title="Pick hour &amp; minute on clock dial"
                        aria-label="Pick time on clock dial"
                        class="absolute right-0 top-0 bottom-0 px-2.5 flex items-center text-indigo-600 hover:text-indigo-800 focus:outline-none">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </button>
            </div>
            <p class="text-[10px] text-gray-500 mt-0.5">Type directly or click clock icon for dial</p>
        </div>
    </div>

    <!-- Live Human-Readable Confirmation Banner -->
    <div class="mt-2 p-2 bg-indigo-50/80 border border-indigo-200 text-xs text-indigo-950 flex items-center space-x-2">
        <span class="text-base leading-none">📅</span>
        <span class="occurrence-preview-label font-medium">
            {% if preset_list.next_occurrence %}
                Will refresh next on: <strong>{{ preset_list.next_occurrence|date:"l, F j, Y \a\t g:i A" }}</strong>
            {% else %}
                Will refresh next on: <strong>{{ default_next_date }} at {{ default_next_time }}</strong>
            {% endif %}
        </span>
    </div>
</div>

<script>
if (typeof initAndroidTimePickers === 'undefined') {
    window.parseTimeTo24 = function(timeStr) {
        if (!timeStr) return { h: 4, m: 0 };
        const clean = timeStr.trim().toLowerCase();
        const isPM = /p/i.test(clean);
        const isAM = /a/i.test(clean);

        // match "4:00" or "4:00am" or "16:30"
        let match = clean.match(/^(\d{1,2}):(\d{2})/);
        if (match) {
            let h = parseInt(match[1], 10);
            const m = parseInt(match[2], 10);
            if (isPM && h < 12) h += 12;
            if (isAM && h === 12) h = 0;
            return { h: Math.min(23, Math.max(0, h)), m: Math.min(59, Math.max(0, m)) };
        }

        // match "4am" or "4 pm" or standalone "4"
        match = clean.match(/^(\d{1,2})/);
        if (match) {
            let h = parseInt(match[1], 10);
            if (isPM && h < 12) h += 12;
            if (isAM && h === 12) h = 0;
            return { h: Math.min(23, Math.max(0, h)), m: 0 };
        }
        return { h: 4, m: 0 };
    };

    window.presetUpdatePreview = function(container) {
        if (!container) return;
        const dateInput = container.querySelector('.occurrence-date-input');
        const timeInput = container.querySelector('.occurrence-time-input');
        const labelEl = container.querySelector('.occurrence-preview-label');
        if (!dateInput || !labelEl) return;

        const dateVal = dateInput.value;
        const timeVal = (timeInput ? timeInput.value : '') || '';
        if (!dateVal) {
            labelEl.innerHTML = 'Will refresh next on: <em>No date selected</em>';
            return;
        }
        try {
            const parts = dateVal.split('-').map(Number);
            const t = parseTimeTo24(timeVal);
            const dt = new Date(parts[0], parts[1] - 1, parts[2], t.h, t.m);
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' };
            labelEl.innerHTML = `Will refresh next on: <strong>${dt.toLocaleDateString(undefined, options)}</strong>`;
        } catch (e) {
            // ignore
        }
    };

    window.triggerClockDialPicker = function(btn) {
        const container = btn.closest('.occurrence-picker-block');
        if (!container) return;
        const textInput = container.querySelector('.occurrence-time-input');
        const proxyInput = container.querySelector('.clock-dial-proxy');
        if (!proxyInput || typeof mdtimepicker === 'undefined') return;

        if (!proxyInput._initialized) {
            proxyInput._initialized = true;
            mdtimepicker(proxyInput, {
                format: 'h:mm tt',
                theme: 'indigo',
                hourPadding: false,
                clearBtn: false,
                is24hour: false
            });
            proxyInput.addEventListener('change', function() {
                if (textInput) {
                    textInput.value = proxyInput.value;
                    textInput.dispatchEvent(new Event('change', { bubbles: true }));
                    presetUpdatePreview(container);
                }
            });
        }

        if (textInput && textInput.value) {
            proxyInput.value = textInput.value;
            try {
                mdtimepicker(proxyInput, 'setValue', textInput.value);
            } catch (e) {}
        }
        try {
            mdtimepicker(proxyInput, 'show');
        } catch (e) {
            console.error(e);
        }
    };

    window.toggleScheduleStatusUI = function(checkbox, badgeId, fieldsContainerId) {
        const badge = document.getElementById(badgeId);
        if (badge) {
            if (checkbox.checked) {
                badge.textContent = 'ACTIVE';
                badge.className = 'text-xs font-bold px-2.5 py-0.5 rounded bg-emerald-100 text-emerald-800 border border-emerald-300';
            } else {
                badge.textContent = 'DISABLED';
                badge.className = 'text-xs font-bold px-2.5 py-0.5 rounded bg-gray-200 text-gray-600 border border-gray-300';
            }
        }
        const container = document.getElementById(fieldsContainerId);
        if (container) {
            if (checkbox.checked) {
                container.classList.remove('opacity-60');
            } else {
                container.classList.add('opacity-60');
            }
        }
    };
}
</script>
