{% extends "base.html" %}

{% block title %}Shopping List - Shoppin{% endblock %}

{% block content %}
<div class="space-y-3">
    <!-- Main List Container (HTMX swapped & WebSocket synchronized) -->
    {% include "shopping/partials/list_content.html" %}
</div>

<!-- Modal Dialog Placeholder -->
<div id="modal-placeholder"></div>
{% endblock %}

{% block extra_scripts %}
<script>
    // 1. Geolocation Helper
    function locateNearestStore() {
        if (!navigator.geolocation) {
            alert("Geolocation is not supported by your browser.");
            return;
        }
        navigator.geolocation.getCurrentPosition(
            function(position) {
                htmx.ajax('POST', '{% url "shopping:nearest_store" %}', {
                    target: '#shopping-list-content',
                    swap: 'outerHTML',
                    values: {
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude,
                        csrfmiddlewaretoken: '{{ csrf_token }}'
                    }
                });
            },
            function(error) {
                alert("Could not retrieve GPS location: " + error.message);
            }
        );
    }

    // 2. SortableJS Drag-and-Drop Reordering Initialization
    function initSortables() {
        // A. Section/Aisle level drag-and-drop
        const sectionsContainer = document.getElementById('section-groups-container');
        if (sectionsContainer && !sectionsContainer._sortable) {
            sectionsContainer._sortable = new Sortable(sectionsContainer, {
                handle: '.section-drag-handle',
                draggable: '.section-group-block',
                animation: 150,
                ghostClass: 'bg-gray-100',
                chosenClass: 'opacity-70',
                onEnd: function(evt) {
                    const groupNames = Array.from(sectionsContainer.querySelectorAll('.section-group-block'))
                        .map(el => el.getAttribute('data-group-name'));
                    const groupBy = sectionsContainer.getAttribute('data-group-by') || 'category';

                    htmx.ajax('POST', '{% url "shopping:reorder_sections" %}', {
                        swap: 'none',
                        values: {
                            'group_names[]': groupNames,
                            'group_by': groupBy,
                            csrfmiddlewaretoken: '{{ csrf_token }}'
                        }
                    });
                }
            });
        }

        // B. Item level drag-and-drop within sections
        document.querySelectorAll('.sortable-group').forEach(group => {
            if (group._sortable) return;
            group._sortable = new Sortable(group, {
                handle: '.drag-handle',
                draggable: '.item-row',
                animation: 120,
                ghostClass: 'bg-gray-100',
                onEnd: function(evt) {
                    const itemIds = Array.from(document.querySelectorAll('.sortable-group [data-item-id]'))
                        .map(el => el.getAttribute('data-item-id'));

                    htmx.ajax('POST', '{% url "shopping:reorder" %}', {
                        swap: 'none',
                        values: {
                            'item_ids[]': itemIds,
                            csrfmiddlewaretoken: '{{ csrf_token }}'
                        }
                    });
                }
            });
        });
    }

    document.addEventListener('DOMContentLoaded', initSortables);
    document.addEventListener('htmx:afterSwap', function(evt) {
        if (evt.detail.target.id === 'shopping-list-content') {
            initSortables();
        }
    });

    // 3. Multi-User WebSocket Synchronization
    (function initShoppingWebSocketSync() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}/ws/shopping/`;
        let socket = null;
        let reconnectTimeout = null;

        function connect() {
            if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) {
                return;
            }

            try {
                socket = new WebSocket(wsUrl);
            } catch (err) {
                console.error("[Shoppin Sync] Connection failed:", err);
                scheduleReconnect();
                return;
            }

            socket.onopen = function() {
                console.log("[Shoppin Sync] Connected to live updates channel.");
            };

            socket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    const isSender = data.sender_client_id && data.sender_client_id === window.CLIENT_ID;

                    // If another client made the change:
                    if (!isSender) {
                        // 1. Show equivalent notification on this client
                        if (data.toast_message) {
                            showToast(data.toast_message);
                        }

                        // 2. Instantly refresh the shopping list in place using HTMX
                        const listContainer = document.getElementById('shopping-list-content');
                        if (listContainer) {
                            const refreshUrl = listContainer.getAttribute('data-refresh-url') || window.location.href;
                            htmx.ajax('GET', refreshUrl, {
                                target: '#shopping-list-content',
                                swap: 'outerHTML transition:true'
                            });
                        }
                    }
                } catch (err) {
                    console.error("[Shoppin Sync] Error parsing message:", err);
                }
            };

            socket.onclose = function() {
                scheduleReconnect();
            };

            socket.onerror = function() {
                try { socket.close(); } catch (_) {}
            };
        }

        function scheduleReconnect() {
            clearTimeout(reconnectTimeout);
            reconnectTimeout = setTimeout(connect, 1500);
        }

        connect();
    })();
</script>
{% endblock %}
