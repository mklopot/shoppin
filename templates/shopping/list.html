{% extends "base.html" %}

{% block title %}Shopping List - Shoppin{% endblock %}

{% block content %}
<div class="space-y-3">
    <!-- Main List Container (HTMX swapped) -->
    {% include "shopping/partials/list_content.html" %}
</div>

<!-- Modal Dialog Placeholder -->
<div id="modal-placeholder"></div>
{% endblock %}

{% block extra_scripts %}
<script>
    // 1. Geolocation Helper
    function locateNearestStore() {
        if (!navigator.geolocation) {
            alert("Geolocation is not supported by your browser.");
            return;
        }
        navigator.geolocation.getCurrentPosition(
            function(position) {
                htmx.ajax('POST', '{% url "shopping:nearest_store" %}', {
                    target: '#shopping-list-content',
                    swap: 'outerHTML',
                    values: {
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude,
                        csrfmiddlewaretoken: '{{ csrf_token }}'
                    }
                });
            },
            function(error) {
                alert("Could not retrieve GPS location: " + error.message);
            }
        );
    }

    // 2. SortableJS Drag-and-Drop Reordering Initialization
    function initSortables() {
        // A. Section/Aisle level drag-and-drop
        const sectionsContainer = document.getElementById('section-groups-container');
        if (sectionsContainer && !sectionsContainer._sortable) {
            sectionsContainer._sortable = new Sortable(sectionsContainer, {
                handle: '.section-drag-handle',
                draggable: '.section-group-block',
                animation: 150,
                ghostClass: 'bg-gray-100',
                chosenClass: 'opacity-70',
                onEnd: function(evt) {
                    const groupNames = Array.from(sectionsContainer.querySelectorAll('.section-group-block'))
                        .map(el => el.getAttribute('data-group-name'));
                    const groupBy = sectionsContainer.getAttribute('data-group-by') || 'category';

                    htmx.ajax('POST', '{% url "shopping:reorder_sections" %}', {
                        swap: 'none',
                        values: {
                            'group_names[]': groupNames,
                            'group_by': groupBy,
                            csrfmiddlewaretoken: '{{ csrf_token }}'
                        }
                    });
                }
            });
        }

        // B. Item level drag-and-drop within sections
        document.querySelectorAll('.sortable-group').forEach(group => {
            if (group._sortable) return;
            group._sortable = new Sortable(group, {
                handle: '.drag-handle',
                draggable: '.item-row',
                animation: 120,
                ghostClass: 'bg-gray-100',
                onEnd: function(evt) {
                    const itemIds = Array.from(document.querySelectorAll('.sortable-group [data-item-id]'))
                        .map(el => el.getAttribute('data-item-id'));

                    htmx.ajax('POST', '{% url "shopping:reorder" %}', {
                        swap: 'none',
                        values: {
                            'item_ids[]': itemIds,
                            csrfmiddlewaretoken: '{{ csrf_token }}'
                        }
                    });
                }
            });
        });
    }

    document.addEventListener('DOMContentLoaded', initSortables);
    document.addEventListener('htmx:afterSwap', function(evt) {
        if (evt.detail.target.id === 'shopping-list-content') {
            initSortables();
        }
    });
</script>
{% endblock %}
