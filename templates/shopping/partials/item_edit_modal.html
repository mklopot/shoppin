<div id="modal-container" role="dialog" aria-modal="true" aria-labelledby="edit-item-modal-title" class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
    <div class="bg-white border border-gray-400 max-w-md w-full p-4 space-y-3 shadow-lg">
        <div class="flex justify-between items-center border-b border-gray-300 pb-2">
            <h3 id="edit-item-modal-title" class="font-bold text-gray-900 text-sm uppercase">Edit Item</h3>
            <button type="button" onclick="document.getElementById('modal-container').remove()" aria-label="Close dialog" class="text-gray-500 hover:text-black font-bold text-lg"><span aria-hidden="true">&times;</span></button>
        </div>

        <form hx-post="{% url 'shopping:edit_item' item.id %}" hx-target="#shopping-list-content" hx-swap="outerHTML transition:true" class="space-y-2.5 text-xs">
            {% csrf_token %}
            <input type="hidden" name="group_by" value="{{ group_by }}">
            <div>
                <label for="edit-item-name" class="block font-bold text-gray-700 mb-0.5">Item Name</label>
                <input type="text" id="edit-item-name" name="name" value="{{ item.name }}" list="all-ingredients-datalist" autocomplete="off" required class="w-full px-2 py-1.5 border border-gray-400 bg-white text-xs">
            </div>

            <div>
                <label for="edit-item-amount" class="block font-bold text-gray-700 mb-0.5">Amount &amp; Unit</label>
                <input type="text" id="edit-item-amount" name="amount" value="{% if item.amount_unit %}{{ item.amount_display }} {{ item.unit_display }}{% else %}{{ item.amount_display }}{% endif %}" placeholder="e.g. 2 lbs, 1/2 cup, 3 cans, 1" class="w-full px-2 py-1.5 border border-gray-400 bg-white text-xs">
                <span class="text-[10px] text-gray-500">Type quantity and unit together (e.g. "2 lbs", "1/2 cup", "1 can") — automatically parsed.</span>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label for="edit-item-category" class="block font-bold text-gray-700 mb-0.5">Category</label>
                    <input type="text" id="edit-item-category" name="category" list="category-datalist" value="{{ item.category }}" placeholder="Select or type category..." autocomplete="off" class="w-full px-2 py-1 border border-gray-400 bg-white rounded-none focus:outline-none focus:border-gray-700">
                    <datalist id="category-datalist">
                        {% for category_option in known_categories %}
                        <option value="{{ category_option }}">
                        {% endfor %}
                    </datalist>
                </div>
                <div>
                    <label for="edit-item-aisle" class="block font-bold text-gray-700 mb-0.5">Aisle</label>
                    <input type="text" id="edit-item-aisle" name="aisle" list="aisle-datalist" value="{{ item.aisle }}" placeholder="Select or type aisle..." autocomplete="off" class="w-full px-2 py-1 border border-gray-400 bg-white rounded-none focus:outline-none focus:border-gray-700">
                    <datalist id="aisle-datalist">
                        {% for aisle_option in known_aisles %}
                        <option value="{{ aisle_option }}">
                        {% endfor %}
                    </datalist>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label for="edit-item-brand" class="block font-bold text-gray-700 mb-0.5">Brand (optional)</label>
                    <input type="text" id="edit-item-brand" name="brand" value="{{ item.brand }}" class="w-full px-2 py-1 border border-gray-400 bg-white">
                </div>
                <div>
                    <label for="edit-item-vendor" class="block font-bold text-gray-700 mb-0.5">Vendor (optional)</label>
                    <input type="text" id="edit-item-vendor" name="vendor" value="{{ item.vendor }}" placeholder="King Soopers, etc" class="w-full px-2 py-1 border border-gray-400 bg-white">
                </div>
            </div>

            <div>
                <label for="edit-item-purpose" class="block font-bold text-gray-700 mb-0.5">Purpose</label>
                <input type="text" id="edit-item-purpose" name="purpose" value="{{ item.purpose_display }}" placeholder="e.g. one-time purchase, snack" class="w-full px-2 py-1 border border-gray-400 bg-white">
            </div>

            <div class="flex items-center space-x-2 pt-1">
                <input type="checkbox" id="edit-item-priority" name="priority" value="true" {% if item.priority %}checked{% endif %} class="h-4 w-4 text-[#800020] border-gray-400 rounded-none cursor-pointer">
                <label for="edit-item-priority" class="font-bold text-gray-800 flex items-center space-x-1.5 cursor-pointer select-none">
                    <span class="px-1.5 py-0.2 text-[10px] font-bold uppercase tracking-wider border border-[#800020]/40 bg-[#fdf2f4] text-[#800020] select-none inline-flex items-center gap-1 rounded-none">
                        <span aria-hidden="true">🚩</span>
                        <span>Priority</span>
                    </span>
                    <span class="text-xs text-gray-500 font-normal">(Flag as high priority item)</span>
                </label>
            </div>

            <div class="flex justify-end space-x-2 pt-2 border-t border-gray-300">
                <button type="button" onclick="document.getElementById('modal-container').remove()" class="px-3 py-1 border border-gray-400 bg-white hover:bg-gray-100 text-gray-700 font-medium">
                    Cancel
                </button>
                <button type="submit" onclick="setTimeout(() => document.getElementById('modal-container')?.remove(), 100)" class="px-3 py-1 bg-gray-900 hover:bg-black text-white font-bold">
                    Save
                </button>
            </div>
        </form>
    </div>
</div>
