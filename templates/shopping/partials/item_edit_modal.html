<div id="modal-container" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4 animate-fade-in">
    <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6 space-y-4" @click.away="document.getElementById('modal-container').remove()">
        <div class="flex justify-between items-center border-b border-gray-100 pb-3">
            <h3 class="text-lg font-bold text-gray-900">Edit Item</h3>
            <button type="button" onclick="document.getElementById('modal-container').remove()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
        </div>

        <form hx-post="{% url 'shopping:edit_item' item.id %}" hx-target="#shopping-list-content" hx-swap="outerHTML" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Item Name</label>
                <input type="text" name="name" value="{{ item.name }}" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-emerald-500 focus:border-emerald-500">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Amount</label>
                    <input type="number" step="any" name="amount" value="{{ item.amount }}" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-emerald-500 focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Unit</label>
                    <input type="text" name="amount_unit" value="{{ item.amount_unit }}" placeholder="e.g. lb, can, bunch" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-emerald-500 focus:border-emerald-500">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Category</label>
                    <input type="text" name="category" value="{{ item.category }}" placeholder="e.g. produce, dairy" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-emerald-500 focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Aisle</label>
                    <input type="text" name="aisle" value="{{ item.aisle }}" placeholder="e.g. Aisle 4, Deli" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-emerald-500 focus:border-emerald-500">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Brand (optional)</label>
                    <input type="text" name="brand" value="{{ item.brand }}" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-emerald-500 focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Best Vendor (optional)</label>
                    <input type="text" name="vendor" value="{{ item.vendor }}" placeholder="King Soopers, etc" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-emerald-500 focus:border-emerald-500">
                </div>
            </div>

            <div class="flex justify-end space-x-2 pt-3 border-t border-gray-100">
                <button type="button" onclick="document.getElementById('modal-container').remove()" class="px-4 py-2 border border-gray-300 text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-50">
                    Cancel
                </button>
                <button type="submit" onclick="setTimeout(() => document.getElementById('modal-container')?.remove(), 100)" class="px-4 py-2 bg-emerald-600 text-white text-sm font-semibold rounded-lg hover:bg-emerald-700 shadow-sm">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
